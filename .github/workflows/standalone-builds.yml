name: Standalone builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: homebru-windows-x64.zip
          - os: ubuntu-latest
            artifact: homebru-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[release]"

      - name: Build standalone executable
        run: python -m PyInstaller --clean --noconfirm homebru.spec

      - name: Smoke test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\dist\homebru.exe --version

      - name: Smoke test Linux executable
        if: runner.os == 'Linux'
        run: ./dist/homebru --version

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath dist\homebru.exe -DestinationPath homebru-windows-x64.zip

      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: tar -czf homebru-linux-x64.tar.gz -C dist homebru

      - uses: actions/upload-artifact@v4
        with:
          name: homebru-${{ runner.os }}-x64
          path: ${{ matrix.artifact }}
          if-no-files-found: error
