[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "homebru"
version = "1.0.0"
description = "A terminal app that lets you host servers on your PC."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "textual>=1.0,<2",
]

[project.optional-dependencies]
test = [
  "fastapi==0.115.0",
  "psutil==6.0.0",
  "uvicorn[standard]==0.30.6",
]

[project.scripts]
homebru = "homebrew_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["homebrew_manager", "agent"]
